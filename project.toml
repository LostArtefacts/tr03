# Steam's tomb3.exe, linked 1998-12-02.
[game]
name = "tomb3"
title = "Tomb Raider III"
window_title = "Tomb Raider III"
dir = "orig/tomb3"
exe = "tomb3.exe"
checksums = "orig/tomb3.sha1"
original = "build/orig/tomb3.exe"
game_end = 0x4b4cbf

[ghidra]
project = "tomb3"
search = ["~/data.local/work/ghidra_*", "~/opt/ghidra_*"]
functions = "build/functions_tomb3.csv"

[build]
hook = "config/exe_layout.py"  # the standalone exe in the original's layout, through tools/orig_layout.py
cflags = ["/G5", "/Zp1", "/W3", "/O2", "/DNDEBUG", "/DWIN32", "/D_WINDOWS"]
crlf = true
bin = 'C:\msvc5sp3\bin'
include = ['C:\dx5\include', 'C:\msvc5sp3\include']
lib = ['C:\dx5\lib', 'C:\msvc5sp3\lib']

[exe]
cflags = ["/Gy"]
defines = ["TR3_EXE=1"]
# The original's import order: DINPUT, DSOUND, DDRAW, WINMM, USER32, GDI32, winplay, KERNEL32.
libs = ["dxguid.lib", "dinput.lib", "dsound.lib", "ddraw.lib", "winmm.lib", "user32.lib",
        "gdi32.lib", "winplay.lib", "libc.lib", "kernel32.lib"]
import_defs = ["config/winplay.def"]  # winplay.dll's 27 imports, from the original's import table
implib_bin = 'C:\msvc5\bin'  # VC5's first lib: the original's winplay.lib has no Rich header entry
resource_object = true  # the original's resources come from cvtres 5.00: 8-byte aligned, no timestamp
ldflags = ["/SUBSYSTEM:WINDOWS", "/FIXED", "/SECTION:.text,RWE"]  # as the original's: self-modifying scanlines
features = { c_asm = "FEAT_C_ASM" }  # C versions of the hand-written assembly
feature_excludes = { c_asm = ["src/3dsystem/phd_math.s", "src/3dsystem/3d_gen_a.s", "src/3dsystem/3d_xouta.s"] }

[dll]
ldflags = ["/DLL", "/NODEFAULTLIB", "/ENTRY:DllMain", "/BASE:0x30000000", "/SECTION:.text,RWE"]  # self-modifying scanlines write into their own code

[symbols]
manifest = "refs/trx/docs/symbols/tr3.txt"

[reference]
source = "refs/core"
prefer = ["GAME"]
skip = ["GAME/GAMEBAK", "GAME/GAMEBAK2"]
layout = { GAME = "", BACKUP = "", SPECIFIC = "specific", "3DSYSTEM" = "3dsystem" }
dsp = "TOMBRAID.DSP"
dsp_config = "TombRaid - Win32 Release"
defines = ["/DCODER=0"]
probe = "build/core_probe.csv"

[hooks]
progress = true  # every commit redraws docs/progress.svg
compare = true  # every compiled function matches the original
one_function = true  # one newly matching function per commit
no_comments = true  # no comments, tabs or CRs in src/
allow_diff = ["KayakControl", "LaraWaterCurrent", "WillBossControl", "TestHeight_minecart", "S_DrawScreenFBox", "GetFullPath", "AdjustTextureUVs", "S_InsertBackground", "S_CalculateStaticMeshLight", "DXUpdateFrame", "S_GetObjectBounds", "Display_Requester", "ScanLinesTFDecalAffine", "EmulateDrawPrimitive", "S_DrawFish", "DrawLondonBossShield", "DrawTonyBossShield", "DrawTribeBossShield", "DrawWillBossShield", "WinMain", "S_DrawSparks", "DoRain", "FlameControl", "PickUpCollision", "MMXInit", "TRDrawPicture", "HWI_InsertTrans8_Sorted", "DrawExplosionRings", "S_DrawDarts", "do_passport_option", "DrawLineG", "S_DrawBat", "DrawKnockBackRings", "DrawSummonRings", "DXTextureAdd", "gtmap_persp32_fp", "wgtmap_persp16_fp", "HWI_InsertObjectG4_Sorted", "calc_roomvert", "calc_vertice_light", "LevelStats", "S_CalculateLight", "TriggerElectricBeam", "TriggerTribeBossHeadElectricity", "S_DrawLaserBolts", "DoSnow", "S_DrawWakeFX", "HWR_SetCurrentTexture"]  # logically equivalent, registers or term order differ
