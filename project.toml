# Steam's tomb3.exe, linked 1998-12-02.
[game]
name = "tomb3"
title = "Tomb Raider III"
window_title = "Tomb Raider III"
dir = "orig/tomb3"
exe = "tomb3.exe"
checksums = "orig/tomb3.sha1"
original = "build/orig/tomb3.exe"
game_end = 0x4b4cbf

[ghidra]
project = "tomb3"
search = ["~/data.local/work/ghidra_*", "~/opt/ghidra_*"]
functions = "build/functions_tomb3.csv"

[build]
cflags = ["/G5", "/Zp1", "/W3", "/O2", "/DNDEBUG", "/DWIN32", "/D_WINDOWS"]
crlf = true
bin = 'C:\msvc5sp3\bin'
include = ['C:\dx5\include', 'C:\msvc5sp3\include']
lib = ['C:\dx5\lib', 'C:\msvc5sp3\lib']

[dll]
ldflags = ["/DLL", "/NODEFAULTLIB", "/ENTRY:DllMain", "/BASE:0x30000000", "/SECTION:.text,RWE"]  # self-modifying scanlines write into their own code

[symbols]
manifest = "refs/trx/docs/symbols/tr3.txt"

[reference]
source = "refs/core"
prefer = ["GAME"]
skip = ["GAME/GAMEBAK", "GAME/GAMEBAK2"]
layout = { GAME = "", BACKUP = "", SPECIFIC = "specific", "3DSYSTEM" = "3dsystem" }
dsp = "TOMBRAID.DSP"
dsp_config = "TombRaid - Win32 Release"
defines = ["/DCODER=0"]
probe = "build/core_probe.csv"

[hooks]
progress = true  # every commit redraws docs/progress.svg
compare = true  # every compiled function matches the original
one_function = true  # one newly matching function per commit
no_comments = true  # no comments, tabs or CRs in src/
allow_diff = ["KayakControl", "LaraWaterCurrent", "TestLaraVault", "WillBossControl", "TestHeight_minecart", "S_DrawScreenFBox", "DXTextureNewPalette", "GetFullPath", "AdjustTextureUVs", "MemBlt", "S_InsertBackground", "DXSaveScreen", "S_CalculateStaticMeshLight", "S_DrawDashBar", "S_DrawAirBar", "DXUpdateFrame", "S_GetObjectBounds", "Display_Requester", "gen_xg", "MMXTextureCopy", "DXTextureAddPal", "ScanLinesTFDecalAffine", "EmulateDrawPrimitive", "S_DrawFish", "DrawLondonBossShield", "DrawTonyBossShield", "DrawTribeBossShield", "DrawWillBossShield", "BoatCheckGeton", "WinMain", "S_DrawSparks", "DoRain", "FlameControl", "CreatureTurn", "PickUpCollision", "S_DrawSprite", "Inv_GlobeLight", "CalculateCinematicCamera", "MMXInit", "DrawPictureAlpha", "TRDrawPicture", "HWI_InsertTrans8_Sorted", "DrawExplosionRings", "S_DrawDarts", "do_passport_option", "Func490110", "S_DrawBat", "DrawKnockBackRings", "DrawSummonRings", "DXTextureAdd", "Inv_RingLight", "gtmap_persp32_fp", "wgtmap_persp16_fp", "HWI_InsertObjectG4_Sorted", "calc_roomvert", "calc_vertice_light", "LevelStats", "S_CalculateLight", "TriggerElectricBeam", "TriggerTribeBossHeadElectricity", "S_DrawLaserBolts", "DoSnow", "S_DrawWakeFX"]  # logically equivalent, registers or term order differ
